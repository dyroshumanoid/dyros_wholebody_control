wbid:
  # Real robot gains
  W_qddot : 2.0
  W_cwr : 2.0
  W_torque : 2.5
  W_energy : 0.2

  # TODO
  # 1. Find the minimum energy minimization weight
  # 2. And then, check the step and sinusoidal responses for each joint.
  # 3. For this case, the gain should be much higher than now.

  friction_coeff : 0.9
  foot_size : 0.3
  foot_width : 0.16

cbf:
  cbf_mode : 1  # 0: idle, 1: kin, 2: dyn
  issf_mode : 1 # 0: no issf, 1: issf
  workspace_boundary_cbf_hand: 0.7

  kin:
    joint_limit_cbf_alpha: 1.0
    joint_limit_cbf_epsilon: 50.0

    workspace_boundary_cbf_alpha: 1.0
    workspace_boundary_cbf_epsilon: 50.0

    self_collision_cbf_alpha: 3.0
    self_collision_cbf_epsilon: 50.0

    obstacle_avoidance_cbf_alpha: 1.0
    obstacle_avoidance_cbf_epsilon: 30.0
  dyn:
    joint_limit_cbf_alpha: 50.0
    joint_limit_cbf_epsilon: 3

    workspace_boundary_cbf_alpha: 30.0
    workspace_boundary_cbf_epsilon: 0.01

    self_collision_cbf_alpha: 30.0
    self_collision_cbf_epsilon: 3.0

    obstacle_avoidance_cbf_alpha: 30.0
    obstacle_avoidance_cbf_epsilon: 3.0

motion_mode : 1 # 0: idle, 1: simple hand motion, 2: taichi, 3: walking, 4: teleop

