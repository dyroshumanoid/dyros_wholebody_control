task_param:
  traj_time: 3.0
  pelv_dist: 0.12
  hand_dist: 0.2
  # step_length: 0.1
  # step_lateral: 0.08
  # step_yaw: 0.1
  step_length: 0.15
  step_lateral: 0.0
  step_yaw: 0.0
  foot_height: 0.055
  # step_duration: 0.9
  # dsp_duration: 0.3
  step_duration: 0.9
  dsp_duration: 0.05

wbid:
  # Real robot gains
  W_qddot : 1.0
  W_cwr : 1.0
  W_torque : 0.0
  W_energy : 0.0

  friction_coeff : 0.9
  foot_size : 0.3
  foot_width : 0.16

cbf:
  cbf_mode : 1  # 0: idle, 1: kin, 2: dyn
  workspace_boundary_cbf_hand: 0.7

  kin:
    joint_limit_cbf_alpha: 1.0
    joint_limit_cbf_epsilon: 50.0

    workspace_boundary_cbf_alpha: 1.0
    workspace_boundary_cbf_epsilon: 1.0

    self_collision_cbf_alpha: 3.0
    self_collision_cbf_epsilon: 50.0

    obstacle_avoidance_cbf_alpha: 3.0
    obstacle_avoidance_cbf_epsilon: 50.0
  dyn:
    joint_limit_cbf_alpha: 50.0
    joint_limit_cbf_epsilon: 3

    workspace_boundary_cbf_alpha: 30.0
    workspace_boundary_cbf_epsilon: 0.01

    self_collision_cbf_alpha: 30.0
    self_collision_cbf_epsilon: 3.0

    obstacle_avoidance_cbf_alpha: 30.0
    obstacle_avoidance_cbf_epsilon: 3.0

motion_mode : 3 # 0: idle, 1: simple hand motion, 2: taichi, 3: walking, 4: teleop

sinusoidal_joint_test:
  joint_target: 18        # motor joint index
  joint_min:   0.1     # [rad]
  joint_max:   0.1     # [rad]
  period:       1.0      # [sec] (min -> max -> min)
  is_step: 1    # 0: sinusoidal, 1: step

